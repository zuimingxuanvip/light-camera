<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI补光相机 - 智能美颜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .app-container {
            background: rgba(42, 42, 58, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            padding: 16px;
            width: 100%;
            max-width: 460px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        
        .header h1 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 4px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 11px;
            color: #94a3b8;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            margin-bottom: 14px;
        }
        
        #cameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
        }
        
        #canvasPreview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .camera-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c2c44 0%, #1a1a2e 100%);
            color: #94a3b8;
            padding: 24px;
            text-align: center;
        }
        
        .camera-placeholder.hidden {
            display: none;
        }
        
        .camera-placeholder .icon {
            font-size: 56px;
            margin-bottom: 14px;
        }
        
        .camera-placeholder h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .camera-placeholder p {
            font-size: 12px;
            line-height: 1.6;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border-top: 3px solid #6366f1;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .enable-camera-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        
        .enable-camera-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 2px;
        }
        
        .beauty-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .beauty-btn {
            height: 52px;
            border: 2px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
        }
        
        .beauty-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }
        
        .beauty-btn.none::before { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
        .beauty-btn.natural::before { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
        .beauty-btn.glamour::before { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); }
        .beauty-btn.ai::before { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        
        .beauty-btn:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        
        .beauty-btn.active {
            border-color: #6366f1;
            background: #312e81;
            color: #fff;
        }
        
        .beauty-btn.active::before {
            opacity: 0.4;
        }
        
        .beauty-icon {
            font-size: 18px;
            z-index: 1;
        }
        
        .beauty-name {
            font-weight: 600;
            z-index: 1;
        }
        
        .ai-sliders {
            background: #1e293b;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .slider-row {
            margin-bottom: 10px;
        }
        
        .slider-row:last-child {
            margin-bottom: 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .slider-label span {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 500;
        }
        
        .slider-value {
            font-size: 11px;
            color: #818cf8;
            font-weight: 700;
        }
        
        .beauty-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        
        .beauty-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.5);
        }
        
        .color-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .preset-btn {
            height: 48px;
            border: 2px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 10px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: #1e293b;
        }
        
        .preset-btn:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        
        .preset-btn.active {
            border-color: #6366f1;
            background: #312e81;
            color: #fff;
        }
        
        .preset-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .warm { background: linear-gradient(135deg, #fef3c7 0%, #fbbf24 100%); }
        .cool { background: linear-gradient(135deg, #dbeafe 0%, #3b82f6 100%); }
        .natural { background: linear-gradient(135deg, #fef9c3 0%, #facc15 100%); }
        .sunset { background: linear-gradient(135deg, #fecaca 0%, #f87171 100%); }
        
        .brightness-control {
            margin-bottom: 12px;
        }
        
        .brightness-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, #1e293b 0%, #6366f1 50%, #8b5cf6 100%);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        
        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.4);
        }
        
        .brightness-value {
            text-align: right;
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
            font-weight: 500;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .action-btn {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
        }
        
        .toggle-light-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }
        
        .toggle-light-btn.off {
            background: #334155;
            color: #64748b;
        }
        
        .voice-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .voice-btn.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .capture-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            grid-column: span 1;
        }
        
        .voice-hint {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: none;
        }
        
        .voice-hint.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .voice-hint h4 {
            color: #10b981;
            font-size: 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        
        .voice-hint ul {
            list-style: none;
            font-size: 11px;
            color: #94a3b8;
        }
        
        .voice-hint li {
            padding: 2px 0;
        }
        
        .voice-hint li::before {
            content: '🎯 ';
        }
        
        .status-bar {
            background: rgba(99, 102, 241, 0.12);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-text {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>✨ AI补光相机</h1>
            <p>专业级智能美颜 · 实时补光</p>
        </div>
        
        <div class="camera-container">
            <video id="cameraPreview" autoplay playsinline></video>
            <canvas id="canvasPreview"></canvas>
            <div class="camera-placeholder" id="cameraPlaceholder">
                <div class="loading-spinner"></div>
                <h3>正在加载AI模型...</h3>
                <p>请稍候，正在初始化专业美颜引擎</p>
            </div>
        </div>
        
        <button class="enable-camera-btn" id="enableCameraBtn">
            <span>📸</span>
            <span id="cameraBtnText">开启AI相机</span>
        </button>
        
        <div class="status-bar" id="statusBar">
            <div class="status-dot"></div>
            <span class="status-text">专业美颜引擎运行中</span>
        </div>
        
        <div class="section-title">🎨 美颜模式</div>
        <div class="beauty-presets">
            <button class="beauty-btn none" data-style="none">
                <span class="beauty-icon">🚫</span>
                <span class="beauty-name">原图</span>
            </button>
            <button class="beauty-btn natural active" data-style="natural">
                <span class="beauty-icon">🌸</span>
                <span class="beauty-name">自然</span>
            </button>
            <button class="beauty-btn glamour" data-style="glamour">
                <span class="beauty-icon">💄</span>
                <span class="beauty-name">精致</span>
            </button>
            <button class="beauty-btn ai" data-style="ai">
                <span class="beauty-icon">🤖</span>
                <span class="beauty-name">AI美颜</span>
            </button>
        </div>
        
        <div class="section-title">⚙️ 精细调节</div>
        <div class="ai-sliders">
            <div class="slider-row">
                <div class="slider-label">
                    <span>👋 瘦脸</span>
                    <span class="slider-value" id="faceSlimValue">20</span>
                </div>
                <input type="range" class="beauty-slider" id="faceSlimSlider" min="0" max="100" value="20">
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>👁️ 大眼</span>
                    <span class="slider-value" id="eyeEnlargeValue">15</span>
                </div>
                <input type="range" class="beauty-slider" id="eyeEnlargeSlider" min="0" max="100" value="15">
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>✨ 磨皮</span>
                    <span class="slider-value" id="smoothValue">40</span>
                </div>
                <input type="range" class="beauty-slider" id="smoothSlider" min="0" max="100" value="40">
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>💡 美白</span>
                    <span class="slider-value" id="whiteningValue">30</span>
                </div>
                <input type="range" class="beauty-slider" id="whiteningSlider" min="0" max="100" value="30">
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>🌟 提亮</span>
                    <span class="slider-value" id="brightenValue">25</span>
                </div>
                <input type="range" class="beauty-slider" id="brightenSlider" min="0" max="100" value="25">
            </div>
        </div>
        
        <div class="section-title">💡 补光色温</div>
        <div class="color-presets">
            <button class="preset-btn active" data-color="warm">
                <div class="preset-color warm"></div>
                <span>暖光</span>
            </button>
            <button class="preset-btn" data-color="cool">
                <div class="preset-color cool"></div>
                <span>冷光</span>
            </button>
            <button class="preset-btn" data-color="natural">
                <div class="preset-color natural"></div>
                <span>自然</span>
            </button>
            <button class="preset-btn" data-color="sunset">
                <div class="preset-color sunset"></div>
                <span>日落</span>
            </button>
        </div>
        
        <div class="section-title">🔆 补光强度</div>
        <div class="brightness-control">
            <input type="range" class="brightness-slider" id="brightnessSlider" min="0" max="100" value="40">
            <div class="brightness-value" id="brightnessValue">强度: 40%</div>
        </div>
        
        <div class="voice-hint" id="voiceHint">
            <h4>🎤 语音控制已开启</h4>
            <ul>
                <li>说"拍照"或"茄子"即可自拍</li>
                <li>说"开始"或"321"倒计时拍照</li>
            </ul>
        </div>
        
        <div class="action-buttons">
            <button class="action-btn toggle-light-btn" id="toggleLightBtn">
                💡 补光
            </button>
            <button class="action-btn voice-btn" id="voiceBtn">
                🎤 语音
            </button>
            <button class="action-btn capture-btn" id="captureBtn">
                📷 拍照
            </button>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1646425229/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675466862/selfie_segmentation.js"></script>
    
    <script>
        const cameraPreview = document.getElementById('cameraPreview');
        const canvasPreview = document.getElementById('canvasPreview');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const enableCameraBtn = document.getElementById('enableCameraBtn');
        const cameraBtnText = document.getElementById('cameraBtnText');
        const statusBar = document.getElementById('statusBar');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessValue = document.getElementById('brightnessValue');
        const toggleLightBtn = document.getElementById('toggleLightBtn');
        const captureBtn = document.getElementById('captureBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const beautyBtns = document.querySelectorAll('.beauty-btn');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceHint = document.getElementById('voiceHint');
        
        const faceSlimSlider = document.getElementById('faceSlimSlider');
        const eyeEnlargeSlider = document.getElementById('eyeEnlargeSlider');
        const smoothSlider = document.getElementById('smoothSlider');
        const whiteningSlider = document.getElementById('whiteningSlider');
        const brightenSlider = document.getElementById('brightenSlider');
        
        const presetColors = {
            warm: { r: 255, g: 200, b: 150 },
            cool: { r: 180, g: 220, b: 255 },
            natural: { r: 255, g: 245, b: 200 },
            sunset: { r: 255, g: 160, b: 160 }
        };
        
        const beautyPresets = {
            none: { smooth: 0, whitening: 0, brighten: 0, faceSlim: 0, eyeEnlarge: 0 },
            natural: { smooth: 40, whitening: 30, brighten: 25, faceSlim: 20, eyeEnlarge: 15 },
            glamour: { smooth: 70, whitening: 50, brighten: 40, faceSlim: 40, eyeEnlarge: 30 },
            ai: { smooth: 60, whitening: 45, brighten: 35, faceSlim: 35, eyeEnlarge: 25 }
        };
        
        let currentPreset = 'warm';
        let currentBeautyStyle = 'natural';
        let currentBrightness = 40;
        let isLightOn = true;
        let isCameraOn = false;
        let isVoiceOn = false;
        let stream = null;
        let recognition = null;
        let faceMesh = null;
        let selfieSegmentation = null;
        let ctx = null;
        let animationId = null;
        let landmarks = null;
        let segmentationMask = null;
        
        const voiceCommands = ['拍照', '茄子', 'cheese', '321', '开始', '咔嚓', '拍一张', '自拍'];
        
        async function initModels() {
            try {
                faceMesh = new FaceMesh({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1646425229/${file}`;
                    }
                });
                
                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                faceMesh.onResults(onFaceMeshResults);
                
                selfieSegmentation = new SelfieSegmentation({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675466862/${file}`;
                    }
                });
                
                selfieSegmentation.setOptions({
                    modelSelection: 1,
                    selfieMode: true
                });
                
                selfieSegmentation.onResults(onSegmentationResults);
                
                await Promise.all([
                    faceMesh.initialize(),
                    selfieSegmentation.initialize()
                ]);
                
                console.log('AI模型初始化成功');
                cameraPlaceholder.innerHTML = `
                    <span class="icon">📷</span>
                    <h3>AI模型已就绪</h3>
                    <p>点击下方按钮开启相机</p>
                    <p>体验专业级美颜效果</p>
                `;
                
            } catch (error) {
                console.error('模型初始化失败:', error);
                cameraPlaceholder.innerHTML = `
                    <span class="icon">⚠️</span>
                    <h3>AI模型加载失败</h3>
                    <p>请检查网络连接后刷新页面</p>
                `;
            }
        }
        
        function onSegmentationResults(results) {
            if (results.segmentationMask) {
                segmentationMask = results.segmentationMask;
            }
        }
        
        function onFaceMeshResults(results) {
            if (!canvasPreview || !ctx) return;
            
            const width = cameraPreview.videoWidth;
            const height = cameraPreview.videoHeight;
            
            canvasPreview.width = width;
            canvasPreview.height = height;
            
            ctx.save();
            
            ctx.scale(-1, 1);
            ctx.drawImage(cameraPreview, -width, 0, width, height);
            ctx.restore();
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                landmarks = results.multiFaceLandmarks[0];
                
                if (currentBeautyStyle !== 'none') {
                    applyProfessionalBeauty(ctx, width, height, landmarks);
                }
            } else {
                landmarks = null;
                if (currentBeautyStyle !== 'none') {
                    applyBasicBeauty(ctx, width, height);
                }
            }
            
            if (isLightOn && currentBrightness > 0) {
                applyLightEffect(ctx, width, height);
            }
            
            ctx.restore();
        }
        
        function applyBasicBeauty(ctx, width, height) {
            const smoothStrength = parseInt(smoothSlider.value) / 100;
            const whiteningStrength = parseInt(whiteningSlider.value) / 100;
            const brightenStrength = parseInt(brightenSlider.value) / 100;
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                
                if (smoothStrength > 0.3) {
                    r = r * (1 - smoothStrength * 0.15) + 128 * smoothStrength * 0.15;
                    g = g * (1 - smoothStrength * 0.15) + 128 * smoothStrength * 0.15;
                    b = b * (1 - smoothStrength * 0.15) + 128 * smoothStrength * 0.15;
                }
                
                if (whiteningStrength > 0) {
                    const avg = (r + g + b) / 3;
                    r = r + whiteningStrength * (255 - avg) * 0.35;
                    g = g + whiteningStrength * (255 - avg) * 0.35;
                    b = b + whiteningStrength * (255 - avg) * 0.35;
                }
                
                if (brightenStrength > 0) {
                    r = Math.min(255, r * (1 + brightenStrength * 0.25));
                    g = Math.min(255, g * (1 + brightenStrength * 0.25));
                    b = Math.min(255, b * (1 + brightenStrength * 0.25));
                }
                
                data[i] = Math.min(255, Math.max(0, r));
                data[i + 1] = Math.min(255, Math.max(0, g));
                data[i + 2] = Math.min(255, Math.max(0, b));
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function applyProfessionalBeauty(ctx, width, height, landmarks) {
            const smoothStrength = parseInt(smoothSlider.value) / 100;
            const whiteningStrength = parseInt(whiteningSlider.value) / 100;
            const brightenStrength = parseInt(brightenSlider.value) / 100;
            const faceSlimStrength = parseInt(faceSlimSlider.value) / 100;
            const eyeEnlargeStrength = parseInt(eyeEnlargeSlider.value) / 100;
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            const skinMask = createSkinMask(width, height, landmarks);
            
            for (let i = 0; i < data.length; i += 4) {
                const idx = i / 4;
                const skinValue = skinMask[idx];
                
                if (skinValue > 0) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];
                    
                    if (smoothStrength > 0) {
                        const blurredR = gaussianBlurPixel(data, width, height, idx, 3, skinValue);
                        const blurredG = gaussianBlurPixel(data, width, height, idx + 1, 3, skinValue);
                        const blurredB = gaussianBlurPixel(data, width, height, idx + 2, 3, skinValue);
                        
                        r = r * (1 - smoothStrength * skinValue * 0.7) + blurredR * smoothStrength * skinValue * 0.7;
                        g = g * (1 - smoothStrength * skinValue * 0.7) + blurredG * smoothStrength * skinValue * 0.7;
                        b = b * (1 - smoothStrength * skinValue * 0.7) + blurredB * smoothStrength * skinValue * 0.7;
                    }
                    
                    if (whiteningStrength > 0) {
                        const yc = 0.299 * r + 0.587 * g + 0.114 * b;
                        const cb = -0.169 * r - 0.331 * g + 0.5 * b + 128;
                        const cr = 0.5 * r - 0.419 * g - 0.081 * b + 128;
                        
                        let newY = Math.min(255, yc * (1 + whiteningStrength * 0.2 * skinValue));
                        let newCb = 128 + (cb - 128) * (1 - whiteningStrength * 0.25 * skinValue);
                        let newCr = 128 + (cr - 128) * (1 - whiteningStrength * 0.35 * skinValue);
                        
                        const finalR = newY + 1.402 * (newCr - 128);
                        const finalG = newY - 0.344 * (newCb - 128) - 0.714 * (newCr - 128);
                        const finalB = newY + 1.772 * (newCb - 128);
                        
                        r = r * (1 - skinValue * whiteningStrength * 0.8) + finalR * skinValue * whiteningStrength * 0.8;
                        g = g * (1 - skinValue * whiteningStrength * 0.8) + finalG * skinValue * whiteningStrength * 0.8;
                        b = b * (1 - skinValue * whiteningStrength * 0.8) + finalB * skinValue * whiteningStrength * 0.8;
                    }
                    
                    if (brightenStrength > 0) {
                        const brightenAmount = brightenStrength * skinValue * 0.3;
                        r = Math.min(255, r * (1 + brightenAmount));
                        g = Math.min(255, g * (1 + brightenAmount));
                        b = Math.min(255, b * (1 + brightenAmount));
                    }
                    
                    data[i] = Math.min(255, Math.max(0, r));
                    data[i + 1] = Math.min(255, Math.max(0, g));
                    data[i + 2] = Math.min(255, Math.max(0, b));
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            if (faceSlimStrength > 0 || eyeEnlargeStrength > 0) {
                applyFaceWarp(ctx, width, height, landmarks, faceSlimStrength, eyeEnlargeStrength);
            }
        }
        
        function createSkinMask(width, height, landmarks) {
            const mask = new Float32Array(width * height);
            const facePoints = [];
            
            const faceOutline = [
                10, 151, 337, 299, 333, 298, 301, 251, 284, 252, 389, 356, 454, 323, 361, 288,
                397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93,
                234, 127, 162, 21, 54, 103, 67, 109, 10
            ];
            
            for (let i = 0; i < faceOutline.length; i++) {
                const point = landmarks[faceOutline[i]];
                if (point) {
                    facePoints.push({ x: point.x * width, y: point.y * height });
                }
            }
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    
                    let minDist = Infinity;
                    for (const point of facePoints) {
                        const dist = Math.sqrt((x - point.x) ** 2 + (y - point.y) ** 2);
                        minDist = Math.min(minDist, dist);
                    }
                    
                    const faceRadius = Math.min(width, height) * 0.4;
                    if (minDist < faceRadius) {
                        mask[idx] = Math.max(0, 1 - minDist / faceRadius);
                    }
                }
            }
            
            const gaussianMask = new Float32Array(mask.length);
            for (let i = 0; i < mask.length; i++) {
                const x = i % width;
                const y = Math.floor(i / width);
                let sum = 0;
                let weightSum = 0;
                
                for (let dy = -3; dy <= 3; dy++) {
                    for (let dx = -3; dx <= 3; dx++) {
                        const nx = Math.min(Math.max(0, x + dx), width - 1);
                        const ny = Math.min(Math.max(0, y + dy), height - 1);
                        const nidx = ny * width + nx;
                        const weight = Math.exp(-(dx * dx + dy * dy) / (2 * 9));
                        sum += mask[nidx] * weight;
                        weightSum += weight;
                    }
                }
                
                gaussianMask[i] = sum / weightSum;
            }
            
            return gaussianMask;
        }
        
        function gaussianBlurPixel(data, width, height, idx, radius, skinValue) {
            let sum = 0;
            let weightSum = 0;
            const x = idx % width;
            const y = Math.floor(idx / width);
            
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = Math.min(Math.max(0, x + dx), width - 1);
                    const ny = Math.min(Math.max(0, y + dy), height - 1);
                    const nidx = (ny * width + nx) * 4 + (idx % 4);
                    const weight = Math.exp(-(dx * dx + dy * dy) / (2 * radius * radius));
                    sum += data[nidx] * weight;
                    weightSum += weight;
                }
            }
            
            return sum / weightSum;
        }
        
        function applyFaceWarp(ctx, width, height, landmarks, faceSlimStrength, eyeEnlargeStrength) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvasPreview, 0, 0);
            
            const outputImage = ctx.createImageData(width, height);
            const sourceImage = tempCtx.getImageData(0, 0, width, height);
            
            const faceCenter = {
                x: landmarks[168].x * width,
                y: landmarks[168].y * height
            };
            
            const leftCheek = {
                x: landmarks[50].x * width,
                y: landmarks[50].y * height
            };
            
            const rightCheek = {
                x: landmarks[280].x * width,
                y: landmarks[280].y * height
            };
            
            const leftEye = {
                x: landmarks[33].x * width,
                y: landmarks[33].y * height
            };
            
            const rightEye = {
                x: landmarks[263].x * width,
                y: landmarks[263].y * height
            };
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let srcX = x;
                    let srcY = y;
                    
                    if (faceSlimStrength > 0) {
                        const distToCenter = Math.sqrt((x - faceCenter.x) ** 2 + (y - faceCenter.y) ** 2);
                        const faceRadius = Math.abs(rightCheek.x - leftCheek.x) * 1.2;
                        
                        if (distToCenter < faceRadius) {
                            const angle = Math.atan2(y - faceCenter.y, x - faceCenter.x);
                            const horizontalFactor = Math.abs(Math.cos(angle));
                            const verticalFactor = Math.abs(Math.sin(angle));
                            
                            const cheekLeftDist = Math.sqrt((x - leftCheek.x) ** 2 + (y - leftCheek.y) ** 2);
                            const cheekRightDist = Math.sqrt((x - rightCheek.x) ** 2 + (y - rightCheek.y) ** 2);
                            
                            const cheekDist = Math.min(cheekLeftDist, cheekRightDist);
                            const cheekInfluence = Math.max(0, 1 - cheekDist / (faceRadius * 0.5));
                            
                            const totalStrength = faceSlimStrength * cheekInfluence * horizontalFactor * 0.3;
                            
                            const dx = x - faceCenter.x;
                            const newDx = dx * (1 - totalStrength);
                            srcX = faceCenter.x + newDx;
                        }
                    }
                    
                    if (eyeEnlargeStrength > 0) {
                        for (const eye of [leftEye, rightEye]) {
                            const eyeDist = Math.sqrt((x - eye.x) ** 2 + (y - eye.y) ** 2);
                            const eyeRadius = Math.min(width, height) * 0.12;
                            
                            if (eyeDist < eyeRadius * 1.5) {
                                const eyeInfluence = Math.max(0, 1 - eyeDist / (eyeRadius * 1.5));
                                const strength = eyeEnlargeStrength * eyeInfluence * 0.25;
                                
                                const dx = x - eye.x;
                                const dy = y - eye.y;
                                
                                const newDx = dx * (1 + strength);
                                const newDy = dy * (1 + strength);
                                
                                srcX = eye.x + newDx;
                                srcY = eye.y + newDy;
                            }
                        }
                    }
                    
                    srcX = Math.min(Math.max(0, srcX), width - 1);
                    srcY = Math.min(Math.max(0, srcY), height - 1);
                    
                    const dstIdx = (y * width + x) * 4;
                    const srcX0 = Math.floor(srcX);
                    const srcY0 = Math.floor(srcY);
                    const srcX1 = Math.min(srcX0 + 1, width - 1);
                    const srcY1 = Math.min(srcY0 + 1, height - 1);
                    const fx = srcX - srcX0;
                    const fy = srcY - srcY0;
                    
                    const idx00 = (srcY0 * width + srcX0) * 4;
                    const idx01 = (srcY0 * width + srcX1) * 4;
                    const idx10 = (srcY1 * width + srcX0) * 4;
                    const idx11 = (srcY1 * width + srcX1) * 4;
                    
                    for (let c = 0; c < 4; c++) {
                        const v00 = sourceImage.data[idx00 + c];
                        const v01 = sourceImage.data[idx01 + c];
                        const v10 = sourceImage.data[idx10 + c];
                        const v11 = sourceImage.data[idx11 + c];
                        
                        const v0 = v00 * (1 - fx) + v01 * fx;
                        const v1 = v10 * (1 - fx) + v11 * fx;
                        const v = v0 * (1 - fy) + v1 * fy;
                        
                        outputImage.data[dstIdx + c] = Math.round(v);
                    }
                }
            }
            
            ctx.putImageData(outputImage, 0, 0);
        }
        
        function applyLightEffect(ctx, width, height) {
            const color = presetColors[currentPreset];
            const alpha = currentBrightness / 100;
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            const centerX = width / 2;
            const centerY = height * 0.35;
            const maxRadius = Math.max(width, height) * 0.7;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    
                    const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                    const falloff = Math.max(0, 1 - dist / maxRadius);
                    const localAlpha = alpha * falloff * 0.35;
                    
                    let r = data[idx];
                    let g = data[idx + 1];
                    let b = data[idx + 2];
                    
                    r = r * (1 - localAlpha * 0.2) + color.r * localAlpha;
                    g = g * (1 - localAlpha * 0.2) + color.g * localAlpha;
                    b = b * (1 - localAlpha * 0.2) + color.b * localAlpha;
                    
                    const brightnessBoost = 1 + localAlpha * 0.25;
                    r = Math.min(255, r * brightnessBoost);
                    g = Math.min(255, g * brightnessBoost);
                    b = Math.min(255, b * brightnessBoost);
                    
                    data[idx] = Math.min(255, Math.max(0, r));
                    data[idx + 1] = Math.min(255, Math.max(0, g));
                    data[idx + 2] = Math.min(255, Math.max(0, b));
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        async function enableCamera() {
            cameraPlaceholder.innerHTML = `
                <div class="loading-spinner"></div>
                <h3>正在启动相机...</h3>
                <p>请稍候</p>
            `;
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 1280, height: 720 },
                    audio: false
                });
                
                cameraPreview.srcObject = stream;
                await cameraPreview.play();
                
                ctx = canvasPreview.getContext('2d', { willReadFrequently: true });
                
                cameraPreview.style.display = 'block';
                cameraPlaceholder.classList.add('hidden');
                enableCameraBtn.innerHTML = '<span>⏸️</span><span>关闭相机</span>';
                cameraBtnText.textContent = '关闭相机';
                statusBar.style.display = 'flex';
                isCameraOn = true;
                
                startProcessing();
                
            } catch (err) {
                console.error('相机错误:', err);
                cameraPlaceholder.innerHTML = `
                    <span class="icon">❌</span>
                    <h3>无法访问相机</h3>
                    <p>请检查相机权限设置</p>
                `;
            }
        }
        
        function disableCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            cameraPreview.srcObject = null;
            cameraPreview.style.display = 'none';
            
            if (ctx) {
                ctx.clearRect(0, 0, canvasPreview.width, canvasPreview.height);
            }
            
            cameraPlaceholder.classList.remove('hidden');
            cameraPlaceholder.innerHTML = `
                <span class="icon">📷</span>
                <h3>AI模型已就绪</h3>
                <p>点击下方按钮开启相机</p>
            `;
            
            enableCameraBtn.innerHTML = '<span>📸</span><span>开启AI相机</span>';
            cameraBtnText.textContent = '开启AI相机';
            statusBar.style.display = 'none';
            isCameraOn = false;
        }
        
        function startProcessing() {
            if (!faceMesh || !cameraPreview) return;
            
            const processFrame = async () => {
                if (!isCameraOn) return;
                
                try {
                    if (cameraPreview.readyState >= 2) {
                        await Promise.all([
                            faceMesh.send({ image: cameraPreview }),
                            selfieSegmentation.send({ image: cameraPreview })
                        ]);
                    }
                } catch (error) {
                    console.error('处理帧错误:', error);
                }
                
                animationId = requestAnimationFrame(processFrame);
            };
            
            processFrame();
        }
        
        function takePhoto() {
            if (!isCameraOn) {
                alert('请先开启相机');
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = canvasPreview.width || cameraPreview.videoWidth;
            canvas.height = canvasPreview.height || cameraPreview.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (canvasPreview.width > 0 && canvasPreview.height > 0) {
                ctx.drawImage(canvasPreview, 0, 0);
            } else {
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(cameraPreview, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            
            const link = document.createElement('a');
            link.download = `ai_photo_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            captureBtn.textContent = '✅ 已保存';
            setTimeout(() => {
                captureBtn.innerHTML = '📷 拍照';
            }, 1500);
        }
        
        function initVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('抱歉，您的浏览器不支持语音识别功能');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            
            recognition.onstart = () => {
                voiceBtn.classList.add('active');
                voiceHint.classList.add('active');
                isVoiceOn = true;
            };
            
            recognition.onend = () => {
                if (isVoiceOn) {
                    try {
                        recognition.start();
                    } catch (err) {
                        isVoiceOn = false;
                        voiceBtn.classList.remove('active');
                        voiceHint.classList.remove('active');
                    }
                }
            };
            
            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    alert('请允许麦克风权限');
                    toggleVoice();
                    return;
                }
                
                if (isVoiceOn && event.error !== 'aborted') {
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch (err) {
                            isVoiceOn = false;
                            voiceBtn.classList.remove('active');
                            voiceHint.classList.remove('active');
                        }
                    }, 1000);
                }
            };
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                
                if (finalTranscript) {
                    console.log('识别到:', finalTranscript);
                    checkVoiceCommand(finalTranscript);
                }
            };
            
            return true;
        }
        
        function checkVoiceCommand(text) {
            const lowerText = text.toLowerCase();
            
            for (let command of voiceCommands) {
                if (lowerText.includes(command.toLowerCase()) || lowerText.includes(command)) {
                    if (command === '321' || command === '开始') {
                        takePhoto();
                    } else {
                        takePhoto();
                    }
                    break;
                }
            }
        }
        
        function toggleVoice() {
            if (isVoiceOn) {
                recognition.stop();
                voiceBtn.classList.remove('active');
                voiceHint.classList.remove('active');
                isVoiceOn = false;
                return;
            }
            
            if (!recognition) {
                const success = initVoiceRecognition();
                if (!success) return;
            }
            
            try {
                recognition.start();
            } catch (err) {
                console.error('启动语音识别失败:', err);
            }
        }
        
        function applyBeautyPreset(style) {
            const preset = beautyPresets[style];
            if (!preset) return;
            
            faceSlimSlider.value = preset.faceSlim;
            eyeEnlargeSlider.value = preset.eyeEnlarge;
            smoothSlider.value = preset.smooth;
            whiteningSlider.value = preset.whitening;
            brightenSlider.value = preset.brighten;
            
            document.getElementById('faceSlimValue').textContent = preset.faceSlim;
            document.getElementById('eyeEnlargeValue').textContent = preset.eyeEnlarge;
            document.getElementById('smoothValue').textContent = preset.smooth;
            document.getElementById('whiteningValue').textContent = preset.whitening;
            document.getElementById('brightenValue').textContent = preset.brighten;
        }
        
        beautyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                beautyBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBeautyStyle = btn.dataset.style;
                applyBeautyPreset(currentBeautyStyle);
            });
        });
        
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                presetBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPreset = btn.dataset.color;
            });
        });
        
        faceSlimSlider.addEventListener('input', () => {
            document.getElementById('faceSlimValue').textContent = faceSlimSlider.value;
        });
        
        eyeEnlargeSlider.addEventListener('input', () => {
            document.getElementById('eyeEnlargeValue').textContent = eyeEnlargeSlider.value;
        });
        
        smoothSlider.addEventListener('input', () => {
            document.getElementById('smoothValue').textContent = smoothSlider.value;
        });
        
        whiteningSlider.addEventListener('input', () => {
            document.getElementById('whiteningValue').textContent = whiteningSlider.value;
        });
        
        brightenSlider.addEventListener('input', () => {
            document.getElementById('brightenValue').textContent = brightenSlider.value;
        });
        
        brightnessSlider.addEventListener('input', () => {
            currentBrightness = parseInt(brightnessSlider.value);
            brightnessValue.textContent = `强度: ${currentBrightness}%`;
        });
        
        toggleLightBtn.addEventListener('click', () => {
            isLightOn = !isLightOn;
            if (isLightOn) {
                toggleLightBtn.innerHTML = '💡 补光';
                toggleLightBtn.classList.remove('off');
            } else {
                toggleLightBtn.innerHTML = '🔴 关灯';
                toggleLightBtn.classList.add('off');
            }
        });
        
        enableCameraBtn.addEventListener('click', () => {
            if (isCameraOn) {
                disableCamera();
            } else {
                enableCamera();
            }
        });
        
        captureBtn.addEventListener('click', takePhoto);
        voiceBtn.addEventListener('click', toggleVoice);
        
        initModels();
    </script>
