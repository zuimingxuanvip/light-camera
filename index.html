<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI补光相机</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,#0f0f23,#1a1a2e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:10px; }
        .app { background:rgba(30,41,59,0.98); border-radius:28px; padding:16px; width:100%; max-width:460px; }
        .header { text-align:center; margin-bottom:12px; }
        .header h1 { font-size:18px; color:#fff; font-weight:700; }
        .header p { font-size:11px; color:#94a3b8; margin-top:4px; }
        
        .camera-box { position:relative; width:100%; aspect-ratio:3/4; border-radius:20px; overflow:hidden; background:#000; margin-bottom:14px; }
        #video { width:100%; height:100%; object-fit:cover; display:none; }
        #canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:none; }
        .placeholder { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:linear-gradient(135deg,#1e293b,#0f0f23); color:#94a3b8; }
        .placeholder.hidden { display:none; }
        .placeholder .icon { font-size:48px; margin-bottom:12px; }
        .placeholder h3 { color:#fff; font-size:16px; margin-bottom:8px; }
        .placeholder p { font-size:12px; }
        
        .btn { width:100%; padding:16px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .25s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(99,102,241,0.4); }
        
        .section { font-size:13px; font-weight:700; color:#fff; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
        .section::before { content:''; width:4px; height:14px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:2px; }
        
        .beauty-presets { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
        .beauty-btn { height:52px; border:2px solid #334155; border-radius:12px; cursor:pointer; transition:all .25s; font-size:11px; color:#94a3b8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:#1e293b; }
        .beauty-btn:hover { border-color:#6366f1; transform:translateY(-2px); }
        .beauty-btn.active { border-color:#6366f1; background:#312e81; color:#fff; }
        .beauty-icon { font-size:18px; }
        .beauty-name { font-weight:600; }
        
        .sliders-box { background:#1e293b; border-radius:14px; padding:12px; margin-bottom:12px; }
        .slider-row { margin-bottom:12px; }
        .slider-row:last-child { margin-bottom:0; }
        .slider-label { display:flex; justify-content:space-between; font-size:11px; color:#cbd5e1; margin-bottom:6px; }
        .slider-val { font-size:11px; color:#818cf8; font-weight:700; }
        .slider { width:100%; height:6px; -webkit-appearance:none; background:#334155; border-radius:3px; outline:none; cursor:pointer; }
        .slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:50%; cursor:pointer; box-shadow:0 3px 10px rgba(99,102,241,0.5); }
        
        .color-presets { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
        .color-btn { height:48px; border:2px solid #334155; border-radius:12px; cursor:pointer; transition:all .25s; font-size:10px; color:#94a3b8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:#1e293b; }
        .color-btn:hover { border-color:#6366f1; transform:translateY(-2px); }
        .color-btn.active { border-color:#6366f1; background:#312e81; color:#fff; }
        .color-dot { width:20px; height:20px; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
        .warm { background:linear-gradient(135deg,#fef3c7,#fbbf24); }
        .cool { background:linear-gradient(135deg,#dbeafe,#3b82f6); }
        .natural { background:linear-gradient(135deg,#fef9c3,#facc15); }
        .sunset { background:linear-gradient(135deg,#fecaca,#f87171); }
        
        .bright-slider-box { margin-bottom:12px; }
        .bright-slider { width:100%; height:8px; -webkit-appearance:none; background:linear-gradient(90deg,#1e293b,#6366f1 50%,#8b5cf6); border-radius:4px; outline:none; cursor:pointer; }
        .bright-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; background:#fff; border-radius:50%; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,0.4); }
        .bright-val { text-align:right; font-size:11px; color:#64748b; margin-top:5px; }
        
        .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .action-btn { padding:14px; border:none; border-radius:14px; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; transition:all .25s; }
        .action-btn:hover { transform:translateY(-2px); }
        .light-btn { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
        .light-btn.off { background:#334155; color:#64748b; }
        .voice-btn { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }
        .voice-btn.active { background:linear-gradient(135deg,#f59e0b,#d97706); }
        .capture-btn { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
        
        .status { background:rgba(99,102,241,0.12); border-radius:10px; padding:8px 12px; margin-bottom:12px; display:none; align-items:center; gap:8px; }
        .status-dot { width:8px; height:8px; border-radius:50%; background:#10b981; }
        .status-text { font-size:11px; color:#94a3b8; }
        
        .voice-hint { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); border-radius:12px; padding:10px 12px; margin-bottom:12px; display:none; }
        .voice-hint.active { display:block; }
        .voice-hint h4 { color:#10b981; font-size:12px; margin-bottom:6px; font-weight:600; }
        .voice-hint ul { list-style:none; font-size:11px; color:#94a3b8; }
        .voice-hint li { padding:2px 0; }
        .voice-hint li::before { content:'🎯 '; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>✨ AI补光相机</h1>
            <p>专业级智能美颜 · 实时补光</p>
        </div>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="placeholder" id="placeholder">
                <span class="icon">📷</span>
                <h3>相机就绪</h3>
                <p>点击下方按钮开启相机</p>
            </div>
        </div>

        <button class="btn" id="startBtn">
            <span>📸</span>
            <span id="btnText">开启相机</span>
        </button>

        <div class="status" id="statusBar">
            <div class="status-dot"></div>
            <span class="status-text">美颜效果运行中</span>
        </div>

        <div class="section">🎨 美颜模式</div>
        <div class="beauty-presets">
            <button class="beauty-btn active" data-preset="none"><span class="beauty-icon">🚫</span><span class="beauty-name">原图</span></button>
            <button class="beauty-btn" data-preset="natural"><span class="beauty-icon">🌸</span><span class="beauty-name">自然</span></button>
            <button class="beauty-btn" data-preset="glamour"><span class="beauty-icon">💄</span><span class="beauty-name">精致</span></button>
            <button class="beauty-btn" data-preset="ai"><span class="beauty-icon">🤖</span><span class="beauty-name">AI美颜</span></button>
        </div>

        <div class="sliders-box">
            <div class="slider-row">
                <div class="slider-label"><span>✨ 磨皮</span><span class="slider-val" id="smoothVal">0</span></div>
                <input type="range" class="slider" id="smoothSlider" min="0" max="100" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>💡 美白</span><span class="slider-val" id="whitenVal">0</span></div>
                <input type="range" class="slider" id="whitenSlider" min="0" max="100" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>💪 瘦脸</span><span class="slider-val" id="slimVal">0</span></div>
                <input type="range" class="slider" id="slimSlider" min="0" max="50" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>👀 大眼</span><span class="slider-val" id="eyeVal">0</span></div>
                <input type="range" class="slider" id="eyeSlider" min="0" max="50" value="0">
            </div>
        </div>

        <div class="section">💡 补光色温</div>
        <div class="color-presets">
            <button class="color-btn active" data-color="warm"><div class="color-dot warm"></div><span>暖光</span></button>
            <button class="color-btn" data-color="cool"><div class="color-dot cool"></div><span>冷光</span></button>
            <button class="color-btn" data-color="natural"><div class="color-dot natural"></div><span>自然</span></button>
            <button class="color-btn" data-color="sunset"><div class="color-dot sunset"></div><span>日落</span></button>
        </div>

        <div class="bright-slider-box">
            <div class="section">🔆 补光强度</div>
            <input type="range" class="bright-slider" id="brightSlider" min="0" max="100" value="30">
            <div class="bright-val" id="brightVal">强度: 30%</div>
        </div>

        <div class="voice-hint" id="voiceHint">
            <h4>🎤 语音控制已开启</h4>
            <ul>
                <li>说"拍照"或"茄子"即可自拍</li>
                <li>说"开始"或"321"倒计时拍照</li>
            </ul>
        </div>

        <div class="actions">
            <button class="action-btn light-btn" id="lightBtn">💡 补光</button>
            <button class="action-btn voice-btn" id="voiceBtn">🎤 语音</button>
            <button class="action-btn capture-btn" id="captureBtn">📷 拍照</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const startBtn = document.getElementById('startBtn');
        const btnText = document.getElementById('btnText');
        const statusBar = document.getElementById('statusBar');
        const voiceHint = document.getElementById('voiceHint');
        
        const smoothSlider = document.getElementById('smoothSlider');
        const whitenSlider = document.getElementById('whitenSlider');
        const slimSlider = document.getElementById('slimSlider');
        const eyeSlider = document.getElementById('eyeSlider');
        const smoothVal = document.getElementById('smoothVal');
        const whitenVal = document.getElementById('whitenVal');
        const slimVal = document.getElementById('slimVal');
        const eyeVal = document.getElementById('eyeVal');
        
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const lightBtn = document.getElementById('lightBtn');
        const captureBtn = document.getElementById('captureBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const beautyBtns = document.querySelectorAll('.beauty-btn');
        const colorBtns = document.querySelectorAll('.color-btn');
        
        const beautyPresets = {
            none: { smooth: 0, whiten: 0, slim: 0, eye: 0 },
            natural: { smooth: 40, whiten: 25, slim: 15, eye: 10 },
            glamour: { smooth: 70, whiten: 50, slim: 30, eye: 25 },
            ai: { smooth: 55, whiten: 35, slim: 22, eye: 18 }
        };
        
        const colors = {
            warm: { r: 255, g: 230, b: 190 },
            cool: { r: 200, g: 225, b: 255 },
            natural: { r: 255, g: 250, b: 220 },
            sunset: { r: 255, g: 210, b: 200 }
        };
        
        let currentPreset = 'none';
        let currentColor = 'warm';
        let smooth = 0, whiten = 0, slim = 0, eye = 0;
        let bright = 30;
        let lightOn = true;
        let cameraOn = false;
        let voiceOn = false;
        let stream = null;
        let recognition = null;
        let animationId = null;
        
        async function startCamera() {
            placeholder.innerHTML = '<span class="icon">📷</span><h3>启动中...</h3><p>请稍候</p>';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    video.style.display = 'block';
                    canvas.style.display = 'block';
                    placeholder.classList.add('hidden');
                    startBtn.innerHTML = '<span>⏸️</span><span>关闭相机</span>';
                    btnText.textContent = '关闭相机';
                    statusBar.style.display = 'flex';
                    cameraOn = true;
                    processFrame();
                };
                await video.play();
            } catch (err) {
                placeholder.innerHTML = '<span class="icon">❌</span><h3>无法访问相机</h3><p>请检查权限设置</p>';
            }
        }
        
        function stopCamera() {
            if (animationId) cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
            video.srcObject = null;
            video.style.display = 'none';
            canvas.style.display = 'none';
            placeholder.classList.remove('hidden');
            placeholder.innerHTML = '<span class="icon">📷</span><h3>相机就绪</h3><p>点击下方按钮开启相机</p>';
            startBtn.innerHTML = '<span>📸</span><span>开启相机</span>';
            btnText.textContent = '开启相机';
            statusBar.style.display = 'none';
            cameraOn = false;
        }
        
        function processFrame() {
            if (!cameraOn) return;
            
            ctx.drawImage(video, 0, 0);
            
            if (smooth > 0 || whiten > 0) {
                applyBeautyEffects();
            }
            
            if (lightOn && bright > 0) {
                applyLightEffect();
            }
            
            animationId = requestAnimationFrame(processFrame);
        }
        
        function applyBeautyEffects() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            if (smooth > 0) {
                const blurSize = Math.floor(1 + smooth / 20);
                applyFastBlur(imageData, blurSize);
            }
            
            if (whiten > 0) {
                const whitenAmount = whiten / 100 * 30;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] + whitenAmount);
                    data[i + 1] = Math.min(255, data[i + 1] + whitenAmount * 0.9);
                    data[i + 2] = Math.min(255, data[i + 2] + whitenAmount * 0.8);
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            if (slim > 0 || eye > 0) {
                applyFaceTransform();
            }
        }
        
        function applyFastBlur(imageData, blurSize) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const tempData = new Uint8ClampedArray(data);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;
                    let count = 0;
                    for (let dy = -blurSize; dy <= blurSize; dy++) {
                        for (let dx = -blurSize; dx <= blurSize; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const idx = (ny * width + nx) * 4;
                                r += tempData[idx];
                                g += tempData[idx + 1];
                                b += tempData[idx + 2];
                                count++;
                            }
                        }
                    }
                    const idx = (y * width + x) * 4;
                    data[idx] = r / count;
                    data[idx + 1] = g / count;
                    data[idx + 2] = b / count;
                }
            }
        }
        
        function applyFaceTransform() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);
            
            if (slim > 0) {
                const slimAmount = slim / 100 * 0.1;
                const centerX = canvas.width / 2;
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const distFromCenter = Math.abs(x - centerX);
                        const scale = 1 - distFromCenter / centerX * slimAmount;
                        const srcX = centerX + (x - centerX) / scale;
                        
                        if (srcX >= 0 && srcX < canvas.width) {
                            ctx.putImageData(tempCtx.getImageData(srcX, y, 1, 1), x, y);
                        }
                    }
                }
            }
        }
        
        function applyLightEffect() {
            const c = colors[currentColor];
            const a = bright / 100;
            const gradient = ctx.createRadialGradient(
                canvas.width * 0.5, canvas.height * 0.3, 0,
                canvas.width * 0.5, canvas.height * 0.3, Math.max(canvas.width, canvas.height) * 0.7
            );
            gradient.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, ${a * 0.3})`);
            gradient.addColorStop(1, `rgba(${c.r}, ${c.g}, ${c.b}, 0)`);
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        
        function takePhoto() {
            if (!cameraOn) { alert('请先开启相机'); return; }
            const photoCanvas = document.createElement('canvas');
            photoCanvas.width = canvas.width;
            photoCanvas.height = canvas.height;
            const photoCtx = photoCanvas.getContext('2d');
            photoCtx.drawImage(canvas, 0, 0);
            
            const link = document.createElement('a');
            link.download = `photo_${Date.now()}.png`;
            link.href = photoCanvas.toDataURL('image/png');
            link.click();
            
            captureBtn.textContent = '✅ 已保存';
            setTimeout(() => captureBtn.innerHTML = '📷 拍照', 1500);
        }
        
        function initVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return false;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            recognition.onstart = () => { voiceBtn.classList.add('active'); voiceHint.classList.add('active'); voiceOn = true; };
            recognition.onend = () => { if (voiceOn) try { recognition.start(); } catch (e) { voiceOn = false; voiceBtn.classList.remove('active'); voiceHint.classList.remove('active'); } };
            recognition.onerror = e => { if (e.error === 'not-allowed') { alert('请允许麦克风权限'); toggleVoice(); } };
            recognition.onresult = e => {
                let t = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) t += e.results[i][0].transcript;
                }
                if (t && ['拍照', '茄子', 'cheese', '321', '开始', '咔嚓', '自拍'].some(c => t.includes(c))) {
                    takePhoto();
                }
            };
            return true;
        }
        
        function toggleVoice() {
            if (voiceOn) {
                recognition.stop();
                voiceBtn.classList.remove('active');
                voiceHint.classList.remove('active');
                voiceOn = false;
                return;
            }
            if (!recognition && !initVoice()) return;
            try { recognition.start(); } catch (e) { }
        }
        
        startBtn.onclick = () => cameraOn ? stopCamera() : startCamera();
        captureBtn.onclick = takePhoto;
        voiceBtn.onclick = toggleVoice;
        
        beautyBtns.forEach(btn => btn.onclick = () => {
            beautyBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPreset = btn.dataset.preset;
            const preset = beautyPresets[currentPreset];
            smooth = preset.smooth;
            whiten = preset.whiten;
            slim = preset.slim;
            eye = preset.eye;
            smoothSlider.value = smooth;
            whitenSlider.value = whiten;
            slimSlider.value = slim;
            eyeSlider.value = eye;
            smoothVal.textContent = smooth;
            whitenVal.textContent = whiten;
            slimVal.textContent = slim;
            eyeVal.textContent = eye;
        });
        
        colorBtns.forEach(btn => btn.onclick = () => {
            colorBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentColor = btn.dataset.color;
        });
        
        smoothSlider.oninput = () => { smooth = parseInt(smoothSlider.value); smoothVal.textContent = smooth; };
        whitenSlider.oninput = () => { whiten = parseInt(whitenSlider.value); whitenVal.textContent = whiten; };
        slimSlider.oninput = () => { slim = parseInt(slimSlider.value); slimVal.textContent = slim; };
        eyeSlider.oninput = () => { eye = parseInt(eyeSlider.value); eyeVal.textContent = eye; };
        brightSlider.oninput = () => { bright = parseInt(brightSlider.value); brightVal.textContent = `强度: ${bright}%`; };
        
        lightBtn.onclick = () => {
            lightOn = !lightOn;
            lightBtn.innerHTML = lightOn ? '💡 补光' : '🔴 关灯';
            lightBtn.classList.toggle('off', !lightOn);
        };
    </script>
</body>
</html>
